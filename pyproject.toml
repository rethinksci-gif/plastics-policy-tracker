[project]
name = "plastics-policy-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
