# Information sources.
#   type:      rss | page-watch | api | email-alert
#   frequency: daily | weekly (weekly sources are fetched on Mondays)
#   trust:     official | trade-association | media
# Only `official` sources can support a published fact. Trade-association and media sources are leads:
# the triage step can flag them, but an update citing them is rejected at review layer 1.
# page-watch: the page text is hashed and compared with the last snapshot; only changes enter the pipeline.
# Sites that block automated access are listed in sources/unreachable.md (not replaced with secondary sources).

sources:
  # ---------------------------------------------------------------- EU: legal texts and procedures
  - id: eu-cellar
    name: EU Publications Office (CELLAR) — new legal acts and Commission documents
    url: https://publications.europa.eu/webapi/rdf/sparql
    type: api
    handler: cellar
    frequency: daily
    jurisdiction: EU
    trust: official
    keywords: [plastic, packaging, "waste shipment", "waste framework", "end-of-life vehicle", "electrical and electronic equipment", microplastic, "circular economy", "public procurement", "recycled content", "food contact", "pellet"]
    notes: Machine access to the documents EUR-Lex displays (EUR-Lex itself returns an empty 202 bot challenge).

  - id: eu-have-your-say
    name: European Commission — Have Your Say initiatives
    url: https://ec.europa.eu/info/law/better-regulation/brpapi/searchInitiatives
    type: api
    handler: have_your_say
    frequency: daily
    jurisdiction: EU
    trust: official
    keywords: [plastic, packaging, "circular economy", "waste", "end-of-life vehicles", "public procurement", microplastic]

  - id: oeil-ppwr
