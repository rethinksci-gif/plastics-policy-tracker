# Domain whitelist used by review layer 1. A domain matches itself and all its subdomains.
# Facts published on the site must cite a domain in `official`. Trade-association and media
# domains are recognised as leads only; an update citing them is rejected.

official:
  # EU institutions and agencies
  - europa.eu                 # covers eur-lex, ec, environment.ec, publications, consilium, europarl, echa, efsa ...
  - europarl.europa.eu
  - consilium.europa.eu
  # UN / multilateral
  - unep.org
  - basel.int
  - brsmeas.org
  - wto.org
  - epingalert.org
  - oecd.org
  # United Kingdom
  - gov.uk
