  - ca.gov                    # calrecycle.ca.gov, leginfo.legislature.ca.gov
  - oregon.gov
  - oregonlegislature.gov
  - colorado.gov
  - leg.colorado.gov
  - maine.gov
  - legislature.maine.gov
