    source_lang: zh
    review_id: seed-cn-recycled-plastic-standards-003
  - date: 2026-07-02
    summary: >-
      GB/T 47920-2026 on testing and characterisation of mechanically recycled PP and PE recycled plastics, a
      modified adoption of ISO 5677:2023, was issued on 2 July 2026 and takes effect on 1 February 2027.
