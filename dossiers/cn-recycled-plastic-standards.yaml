summary: >-
  Recommended national standards (GB/T) on recycled plastics, published through the State Administration for
  Market Regulation's national standards platform: the GB/T 40006 series by polymer, identification and marking
  (GB/T 45090-2024), chain of custody (GB/T 47982-2026) and test methods (GB/T 47920-2026).
updates:
  - date: 2026-07-30
    summary: >-
      GB/T 47982-2026, Requirements for the chain of custody managing system of recycled plastics, was issued on
      30 July 2026 and takes effect on 1 November 2026.
