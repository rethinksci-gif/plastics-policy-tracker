summary: Regulation (EU) 2024/1157 replaces Regulation (EC) No 1013/2006. It applies from 21 May 2026;
  the prohibition on exporting plastic waste (entry B3011) to non-OECD countries applies from 21 November
  2026.
updates:
- date: '2026-09-18'
  summary: The European Commission opened a feedback period from 18 September 2026 to 16 October 2026
    on a delegated regulation establishing a list of non-OECD countries authorised to import certain non-hazardous
    waste from the EU. The new Waste Shipment Regulation bans the export of non-hazardous waste to non-OECD
    countries from 21 May 2027.
  source_url: https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14861_en
