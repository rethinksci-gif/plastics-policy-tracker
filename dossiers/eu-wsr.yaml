id: eu-wsr
title: Waste Shipment Regulation (WSR) — Regulation (EU) 2024/1157
short_title: Waste Shipment Regulation
jurisdiction: EU
instrument: regulation
topics: [waste-shipments, plastic-waste-exports, recycling]
stage: in-application
affected: [recyclers, waste-traders, exporters]
impact: high
official_links:
  - https://eur-lex.europa.eu/eli/reg/2024/1157/oj/eng
  - https://publications.europa.eu/resource/celex/32024R1157
  - https://environment.ec.europa.eu/topics/waste-and-recycling/waste-shipments_en
summary: >-
  Regulation (EU) 2024/1157 replaces Regulation (EC) No 1013/2006. It applies from 21 May 2026; the
  prohibition on exporting plastic waste (entry B3011) to non-OECD countries applies from 21 November 2026.
updates:
