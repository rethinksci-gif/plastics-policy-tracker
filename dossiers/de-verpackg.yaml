key_dates:
  - date: 2026-08-11
    text: The 2017 Packaging Act (VerpackG) ceases to have effect at the end of this day (Article 7).
    source_url: https://dserver.bundestag.de/brd/2026/0377-26.pdf
  - date: 2030-01-01
    text: Article 4 point 1 enters into force (Article 8(1)).
