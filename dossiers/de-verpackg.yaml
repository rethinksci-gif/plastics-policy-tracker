summary: >-
  Germany's law adapting packaging law to Regulation (EU) 2025/40 was adopted by the Bundestag on 11 June 2026.
  It repeals the 2017 Packaging Act (VerpackG) with effect from the end of 11 August 2026.
updates:
  - date: 2026-06-11
    summary: >-
      The Bundestag adopted the law adapting packaging law and other areas of law to Regulation (EU) 2025/40 at
      its 83rd sitting on 11 June 2026, following the environment committee's report (Drucksache 21/6398).
    source_url: https://dserver.bundestag.de/brd/2026/0377-26.pdf
    source_quote: "Der Deutsche Bundestag hat in seiner 83. Sitzung am 11. Juni 2026 aufgrund der Beschlussempfehlung und des Berichtes des Ausschusses fü r Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit – Drucksache 21/6398 –"
    source_quote_en: "At its 83rd sitting on 11 June 2026, on the basis of the recommendation and report of the Committee on the Environment, Climate Action, Nature Conservation and Nuclear Safety – printed paper 21/6398 – the German Bundestag ..."
    source_lang: de
    stage_change: adopted
    review_id: seed-de-verpackg-001
