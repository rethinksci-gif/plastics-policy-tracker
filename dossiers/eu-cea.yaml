    source_quote: "receivingFeedbackStatus: CLOSED; feedbackStartDate: 2025/08/01 08:33:10; feedbackEndDate: 2025/11/06 23:59:59"
    stage_change: consultation
    review_id: seed-eu-cea-002
  - date: 2025-10-21
    summary: >-
      The Commission work programme 2026 lists the Circular Economy Act as a legislative initiative under
      Article 114 TFEU planned for the third quarter of 2026.
    source_url: https://publications.europa.eu/resource/celex/52025DC0870
    source_quote: "Circular Economy Act (legislative, Article 114 TFEU, Q3 2026)"
    stage_change: planned
    review_id: seed-eu-cea-001
next_steps:
