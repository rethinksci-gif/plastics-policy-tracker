id: eu-cea
title: Circular Economy Act (CEA)
short_title: Circular Economy Act
jurisdiction: EU
instrument: regulation
topics: [circular-economy, secondary-raw-materials, single-market-for-waste, recycled-content]
stage: consultation
affected: [recyclers, converters, brand-owners, waste-traders]
impact: high
official_links:
  - https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14812_en
