    text: Comment deadline on CAA's third program plan amendment.
    source_url: https://www.oregon.gov/deq/recycling/pages/modernizing-oregons-recycling-system.aspx
  - date: 2026-10-30
    text: Comment deadline on the third RMA rulemaking.
