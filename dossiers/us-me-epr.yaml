summary: Maine's Stewardship Program for Packaging, established by a law passed in July 2021. The Board
  of Environmental Protection adopted the program rule, Chapter 428, in December 2024, and it was amended
  in March 2026. A stewardship organisation is to run the program day to day; in September 2026 the Department
  of Environmental Protection announced it would revise its request for proposals after none were submitted.
