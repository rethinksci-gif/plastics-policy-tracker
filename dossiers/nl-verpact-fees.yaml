id: nl-verpact-fees
title: Netherlands — Verpact packaging waste management fee and plastic fee modulation
short_title: Verpact fee modulation
jurisdiction: EU-NL
instrument: EPR-scheme
topics: [EPR, packaging, eco-modulation, recycled-content, bio-based]
stage: in-application
affected: [brand-owners, importers, converters, recyclers]
impact: high
official_links:
  - https://www.verpact.nl/en/fee-modulation-plastic-2027-circulair-plastics
  - https://www.verpact.nl/nl/tarieven
  - https://www.verpact.nl/en/rates
summary: >-
  Verpact, the Dutch packaging producer responsibility organisation, sets the annual packaging waste
  management fee. From 2027 the discount for recyclate and bio-based drop-ins rises to up to EUR 0.78/kg,
  with the full discount only for material from countries on Verpact's list.
updates:
  - date: 2026-07
    summary: >-
      Verpact published a forecast of its 2027 rates in July 2026; it states that the final 2027 rates, now set,
      largely follow that forecast.
    source_url: https://www.verpact.nl/nl/tarieven
    source_quote: "In juli 2026 publiceerden we al een prognose voor de tarieven van 2027. De definitieve tarieven sluiten hier grotendeels op aan."
    source_quote_en: "In July 2026 we already published a forecast of the 2027 rates. The final rates largely follow it."
    source_lang: nl
    review_id: seed-nl-verpact-fees-003
next_steps: []
key_dates:
  - date: 2027-01-01
    text: >-
      2027 rates apply. Circular Plastics discount for recyclate and bio-based drop-ins of up to EUR 0.78/kg (EUR 1.18/kg
      combined with Design for Recycling); full discount only for material from countries on Verpact's list,
      one quarter otherwise.
    source_url: https://www.verpact.nl/en/fee-modulation-plastic-2027-circulair-plastics
