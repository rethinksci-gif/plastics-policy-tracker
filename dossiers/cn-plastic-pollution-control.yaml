summary: >-
  The NDRC and the Ministry of Ecology and Environment's action plan for plastic pollution control in the
  14th Five-Year Plan period (2021–2025), building on the 2020 opinions restricting single-use plastics.
  A successor plan for 2026–2030 has not yet been verified.
