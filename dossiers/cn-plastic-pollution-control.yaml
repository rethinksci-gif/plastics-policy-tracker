summary: Action plan on plastic pollution control for the 14th Five-Year Plan period, issued by the National
  Development and Reform Commission and the Ministry of Ecology and Environment (Fagai Huanzi [2021] No.
  1298). It aims to further improve whole-chain governance of plastic pollution, promote source reduction
  in plastic production and use, promote plastic substitutes, and speed up the proper collection and recycling
  of plastic waste.
