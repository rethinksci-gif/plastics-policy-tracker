  - date: 2022-04-01
    summary: Plastic Packaging Tax came into force on 1 April 2022 at £200 per tonne for plastic packaging components containing less than 30% recycled plastic.
    source_url: https://www.gov.uk/guidance/check-if-you-need-to-register-for-plastic-packaging-tax
    source_quote: "The tax came into force on 1 April 2022 and is charged at a rate of: - £200 per tonne from 1 April 2022"
