id: eu-ppwr
title: Packaging and Packaging Waste Regulation (PPWR)
short_title: PPWR
jurisdiction: EU
instrument: regulation
topics: [packaging, recycled-content, EPR, reuse, labelling, PFAS]
stage: in-application
affected: [recyclers, converters, brand-owners, retailers, importers]
impact: high
official_links:
  - https://eur-lex.europa.eu/eli/reg/2025/40/oj/eng
  - https://publications.europa.eu/resource/celex/32025R0040
  - https://environment.ec.europa.eu/topics/waste-and-recycling/packaging-waste_en
  - https://green-forum.ec.europa.eu/packaging-and-packaging-waste-regulation-implementation_en
summary: >-
  Regulation (EU) 2025/40 replaces the 1994 Packaging Directive with directly applicable rules on
  packaging design, recycled content, reuse, labelling, EPR and deposit return. It applies from
  12 August 2026; most detailed obligations depend on implementing and delegated acts due 2026–2030.
updates:
  - date: 2026-08-12
    summary: The Regulation became applicable across the EU on 12 August 2026; Article 67(5) applies from 12 February 2029.
    source_url: https://publications.europa.eu/resource/celex/32025R0040
    source_quote: "It shall apply from 12 August 2026. However, Article 67(5) shall apply from 12 February 2029."
    stage_change: in-application
    review_id: seed-eu-ppwr-004
  - date: 2026-02
    summary: >-
      The Commission adopted a delegated act exempting economic operators using pallet wrappings and
      straps from the 100% reuse targets for transport packaging.
    source_url: https://green-forum.ec.europa.eu/packaging-and-packaging-waste-regulation-implementation_en
    source_quote: "A delegated act exempting economic operators using pallet wrappings and straps from the 100% reuse targets for transport packaging was adopted in February 2026."
    review_id: seed-eu-ppwr-003
  - date: 2025-02-11
    summary: The Regulation entered into force on 11 February 2025.
    source_url: https://environment.ec.europa.eu/topics/waste-and-recycling/packaging-waste_en
    source_quote: "Status: In force since 11 February 2025"
    stage_change: in-force
    review_id: seed-eu-ppwr-002
  - date: 2025-01-22
    summary: >-
      Regulation (EU) 2025/40 of 19 December 2024 on packaging and packaging waste was published in the
      Official Journal on 22 January 2025.
    source_url: https://publications.europa.eu/resource/celex/32025R0040
    source_quote: "Official Journal of the European Union EN L series 2025/40 22.1.2025 REGULATION (EU) 2025/40 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL of 19 December 2024 on packaging and packaging waste"
    stage_change: published
    review_id: seed-eu-ppwr-001
