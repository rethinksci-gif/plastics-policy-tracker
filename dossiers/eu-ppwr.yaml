summary: Regulation (EU) 2025/40 replaces the 1994 Packaging Directive with directly applicable rules
  on packaging design, recycled content, reuse, labelling, EPR and deposit return. It applies from 12
  August 2026; most detailed obligations depend on implementing and delegated acts due 2026–2030.
