id: eu-supd
title: Single-Use Plastics Directive (SUPD) — Directive (EU) 2019/904
short_title: SUPD
jurisdiction: EU
instrument: directive
topics: [single-use, recycled-content, PET, EPR, beverage-bottles]
stage: implementing-acts
affected: [converters, brand-owners, recyclers, retailers]
impact: high
official_links:
  - https://eur-lex.europa.eu/eli/dir/2019/904/oj/eng
  - https://publications.europa.eu/resource/celex/32019L0904
  - https://publications.europa.eu/resource/celex/32026D1425
  - https://publications.europa.eu/resource/celex/52026XC04813
summary: >-
  Directive (EU) 2019/904 restricts certain single-use plastic products and sets recycled-content targets for
  single-use plastic beverage bottles. Implementing Decision (EU) 2026/1425 sets the rules for calculating,
  verifying and reporting recycled content in those bottles.
updates:
  - date: 2026-09-08
    summary: >-
      The Commission published a notice updating its guidelines on single-use plastic products under
      Directive (EU) 2019/904 (C/2026/4813).
    source_url: https://publications.europa.eu/resource/celex/52026XC04813
    source_quote: "COMMISSION NOTICE Updating Commission guidelines on single-use plastic products in accordance with Directive (EU) 2019/904 of the European Parliament and of the Council on the reduction of the impact of certain plastic products on the environment (C/2026/4813)"
    review_id: seed-eu-supd-002
  - date: 2026-07-03
    summary: >-
      Commission Implementing Decision (EU) 2026/1425 of 30 June 2026 on the calculation, verification and
      reporting of recycled plastic content in single-use plastic beverage bottles was published, repealing
      Implementing Decision (EU) 2023/2683.
    source_url: https://publications.europa.eu/resource/celex/32026D1425
    source_quote: "COMMISSION IMPLEMENTING DECISION (EU) 2026/1425 of 30 June 2026 laying down rules for the application of Directive (EU) 2019/904 of the European Parliament and of the Council as regards the calculation, verification and reporting of data on recycled plastic content in single-use plastic beverage bottles and repealing Commission Implementing Decision (EU) 2023/2683"
    review_id: seed-eu-supd-001
next_steps:
  - date: 2030-01-01
    text: The Commission must review Implementing Decision (EU) 2026/1425 by this date at the latest.
    source_url: https://publications.europa.eu/resource/celex/32026D1425
key_dates: []
