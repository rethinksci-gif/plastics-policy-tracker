key_dates:
  - date: 2026-07-01
    text: After this date producers must be a member of a registered producer responsibility organisation (Sec. 104).
    source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Session%20Laws/Senate/5284-S2.SL.pdf
  - date: 2026-10-01
    text: Initial statewide collection lists due (Sec. 109).
