id: us-wa-epr
title: Washington State — Recycling Reform Act (E2SSB 5284) packaging and paper EPR
short_title: Washington packaging EPR
jurisdiction: US-WA
instrument: EPR-scheme
topics: [EPR, packaging, paper, needs-assessment]
stage: implementing-acts
affected: [brand-owners, recyclers, municipalities]
impact: medium
official_links:
  - https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Session%20Laws/Senate/5284-S2.SL.pdf
summary: >-
  Engrossed Second Substitute Senate Bill 5284 (Chapter 316, Laws of 2025) creates producer responsibility for
  packaging and paper products in Washington, overseen by the Department of Ecology.
updates:
  - date: 2025-05-17
    summary: The Governor approved E2SSB 5284 on 17 May 2025 after it passed the House (14 April 2025) and Senate (23 April 2025).
    source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Session%20Laws/Senate/5284-S2.SL.pdf
    source_quote: "Passed by the Senate April 23, 2025. Passed by the House April 14, 2025. Approved by the Governor May 17, 2025."
    stage_change: adopted
    review_id: seed-us-wa-epr-001
