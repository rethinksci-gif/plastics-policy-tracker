id: eu-pellet-losses
title: Plastic Pellet Losses Regulation — Regulation (EU) 2025/2365
short_title: Pellet Losses Regulation
jurisdiction: EU
instrument: regulation
topics: [microplastics, pellets, logistics]
stage: in-force
affected: [polymer-producers, converters, recyclers, logistics]
impact: medium
official_links:
  - https://eur-lex.europa.eu/eli/reg/2025/2365/oj/eng
  - https://publications.europa.eu/resource/celex/32025R2365
summary: >-
  Regulation (EU) 2025/2365 sets obligations on economic operators handling plastic pellets, and on carriers,
  to prevent pellet losses. It applies from 17 December 2027, with some provisions applying earlier.
