summary: The Producer Responsibility Obligations (Packaging and Packaging Waste) Regulations 2024 set
  extended producer responsibility for packaging in the UK. Large producers must report packaging data,
  meet recycling obligations with PRNs or PERNs, and pay a waste disposal fee for household packaging
  to PackUK, the scheme administrator; small producers have fewer obligations.
