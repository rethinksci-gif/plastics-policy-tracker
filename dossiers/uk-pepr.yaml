id: uk-pepr
title: UK — Extended producer responsibility for packaging (pEPR)
short_title: UK packaging EPR
jurisdiction: UK
instrument: EPR-scheme
topics: [EPR, packaging, fees, PRN]
stage: in-application
affected: [brand-owners, importers, retailers, recyclers, reprocessors]
impact: high
official_links:
  - https://www.legislation.gov.uk/uksi/2024/1332/made
  - https://www.gov.uk/government/collections/extended-producer-responsibility-for-packaging
  - https://www.gov.uk/guidance/extended-producer-responsibility-for-packaging-who-is-affected-and-what-to-do
summary: >-
  The Producer Responsibility Obligations (Packaging and Packaging Waste) Regulations 2024 require obligated
  producers to report packaging data, meet recycling obligations through PRNs/PERNs and pay waste disposal fees
  for household packaging to PackUK, the scheme administrator.
updates:
