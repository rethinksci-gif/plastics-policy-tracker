summary: Amendments to the Basel Convention annexes on plastic waste, effective from 1 January 2021. They
  add entry Y48 to Annex II, covering plastic waste, including mixtures of such wastes, unless these are
  hazardous (entry A3210) or presumed not to be hazardous (entry B3011).
