summary: Commission proposal COM(2026) 590 for a regulation on public contracts and concessions, repealing
  Directives 2014/23/EU, 2014/24/EU and 2014/25/EU. It strengthens the contribution of procurement to
  circularity, recycled and refurbished content and waste recovery, and creates a framework for mandatory
  green procurement requirements for certain product categories.
