  summary: The Commission published its proposal for a regulation on public contracts and concessions
    (COM(2026) 590), which strengthens the contribution of procurement to circularity, recycled and refurbished
    content and waste recovery, and creates a framework for mandatory green procurement requirements for
    certain products.
  source_url: https://publications.europa.eu/resource/celex/52026PC0590
  source_quote: It strengthens the contribution of procurement to circularity, recycled and refurbished
    content, waste recovery and energy efficiency, and creates a framework for mandatory green procurement
    requirements for certain product categories where divergent application of requirement risks creating
    market fragmentation.
