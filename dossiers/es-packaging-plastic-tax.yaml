summary: Spain's Law 7/2022 of 8 April on waste and contaminated soils for a circular economy sets a tax
  rate of EUR 0.45 per kilogram (Article 78) for its special tax on non-reusable plastic packaging. Royal
  Decree 1055/2022 of 27 December governs packaging and packaging waste.
updates:
