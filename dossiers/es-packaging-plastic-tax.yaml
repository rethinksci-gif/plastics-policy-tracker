  source_quote_en: 'Royal Decree 1055/2022 of 27 December on packaging and packaging waste. Published
    in: BOE no. 311 of 28/12/2022. Entry into force: 29/12/2022'
  source_lang: es
  stage_change: in-force
  review_id: seed-es-packaging-plastic-tax-002
- date: '2022-04-08'
  summary: Law 7/2022 of 8 April set the tax rate on non-reusable plastic packaging at EUR 0.45 per kilogram.
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2022-5809
  source_quote: Artículo 78. Tipo impositivo. El tipo impositivo será de 0,45 euros por kilogramo.
  source_quote_en: Article 78. Tax rate. The tax rate shall be EUR 0.45 per kilogram.
  source_lang: es
  stage_change: adopted
