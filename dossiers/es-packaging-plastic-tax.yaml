  summary: Royal Decree 1055/2022 of 27 December on packaging and packaging waste was published in the
    BOE on 28 December 2022 and entered into force on 29 December 2022.
  source_url: https://www.boe.es/buscar/act.php?id=BOE-A-2022-22690
  source_quote: 'Real Decreto 1055/2022, de 27 de diciembre, de envases y residuos de envases. Publicado
