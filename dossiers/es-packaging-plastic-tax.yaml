id: es-packaging-plastic-tax
title: Spain — packaging decree (RD 1055/2022) and tax on non-reusable plastic packaging (Law 7/2022)
short_title: Spain packaging EPR and plastic tax
title_original: Real Decreto 1055/2022 de envases y residuos de envases; Impuesto especial sobre los envases
  de plástico no reutilizables
jurisdiction: EU-ES
instrument: tax
topics:
